<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دپارتمان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>دپارتمان حسینی‌نژاد</title>

<style>
:root{--bg:#eef1f5;--cd:#fff;--tx:#17263c;--mu:#65748a;--ac:#a8822f;--ac2:#f6efde;--ink:#17263c;--on:#fff;--bd:#d9dfe7;--ok:#2f7d5b;--bad:#b4453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1824;--cd:#172233;--tx:#e6ebf2;--mu:#93a1b5;--ac:#d4ab5a;--ac2:#2a2616;--ink:#d4ab5a;--on:#0f1824;--bd:#27354a;--ok:#5fbf92;--bad:#e8806f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1824;--cd:#172233;--tx:#e6ebf2;--mu:#93a1b5;--ac:#d4ab5a;--ac2:#2a2616;--ink:#d4ab5a;--on:#0f1824;--bd:#27354a;--ok:#5fbf92;--bad:#e8806f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:linear-gradient(135deg,#14213a,#243c62);color:#fff;padding:16px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ac)}
.brand{display:flex;align-items:center;gap:12px}
.lg{width:48px;height:48px;flex:none;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
header h1{margin:0;font-size:21px;font-weight:800}
header small{display:block;opacity:.75;font-size:12px}
.clk{text-align:left;font-size:13px;line-height:1.5}
.clk b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;padding:0 8px}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:600 14px Vazirmatn,Tahoma,sans-serif;padding:12px 12px 9px;cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac)}
#nv{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:6px 10px}
.bar .mb{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:20px;line-height:1;padding:6px 12px;cursor:pointer}
.bar b{font-size:15px;color:var(--tx)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.dr{position:fixed;top:0;bottom:0;right:0;width:min(78vw,300px);background:var(--cd);z-index:21;padding:calc(env(safe-area-inset-top,0px) + 12px) 8px 16px;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.25)}
.dr button{display:block;width:100%;text-align:right;background:none;border:0;border-radius:8px;color:var(--tx);font:600 15px Vazirmatn,Tahoma,sans-serif;padding:12px 14px;cursor:pointer}
.dr button.on{background:var(--ac2)}
.dr .ex{margin-top:10px;border-top:1px solid var(--bd);border-radius:0;color:var(--bad)}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--cd);border:1px solid var(--bd);border-inline-start:4px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,33,58,.06),0 8px 20px -12px rgba(20,33,58,.25)}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.tag{flex:none;direction:ltr;font:600 13px/1 ui-monospace,Menlo,monospace;background:var(--ac2);color:var(--ac);border:1.5px solid var(--ac);border-radius:4px 14px 14px 4px;padding:6px 10px 6px 14px;position:relative}
.tag::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.st{font-size:12px;border-radius:99px;padding:1px 9px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.st.g{color:var(--ok);border-color:var(--ok)}.st.r{color:var(--bad);border-color:var(--bad)}.st.y{color:var(--ac);border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:3px 11px;font:400 13px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--on);border:0;border-radius:8px;padding:8px 14px;font:600 14px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.kpi{border-radius:14px}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--ac)}
.hero{background:linear-gradient(135deg,#14213a,#2a4469);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden;min-height:96px}
.hero b{display:block;font-size:20px;font-weight:800}
.hero span{opacity:.85;font-size:14px;position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;left:-18px;bottom:-30px;border:2px solid rgba(212,171,90,.45);border-radius:999px 999px 0 0;border-bottom:0}
.hero::before{width:130px;height:150px}
.hero::after{left:2px;bottom:-30px;width:90px;height:110px;border-color:rgba(212,171,90,.7)}
.lgn{text-align:center;margin-bottom:8px}
.lgn .lg{width:72px;height:72px;margin:0 auto 8px}
.lgn b{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mu);font-weight:600;font-size:12px}
input,select,textarea{width:100%;font:400 15px Vazirmatn,Tahoma,sans-serif;padding:8px 10px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:9px}
.mo{position:fixed;inset:0;background:rgba(10,16,26,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--cd);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.md h3{margin:0 0 12px}.bt{display:flex;gap:8px}
.login{max-width:440px;margin:20px auto}
.warn{border-color:var(--bad)}
.note{font-size:12px;color:var(--mu);margin-top:8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#a2h{display:none;align-items:center;gap:10px;margin:8px 12px 0;padding:10px 12px;background:var(--ac2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:14px}
#a2h b{flex:1}
#a2h .x{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
#a2hm{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#a2hm .sh{background:var(--cd);color:var(--tx);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#a2hm ol{margin:10px 0 14px;padding-inline-start:22px}
#a2hm li{margin-bottom:8px}

html:root:root{color-scheme:light;--bg:#f7f4ed;--cd:#ffffff;--tx:#1b2535;--mu:#5d6a7c;--ac:#9a6f12;--ac2:#f8f0dc;--ink:#14213a;--on:#ffffff;--bd:#e4ddcc;--ok:#2a7a56;--bad:#b4453a}
header{background:linear-gradient(135deg,#14213a,#243c62)!important;border-bottom:3px solid #d4ab5a!important}
.card{box-shadow:0 6px 18px -10px rgba(20,33,58,.25)}
.banner{border-radius:20px;overflow:hidden;border:1px solid rgba(154,111,18,.5);box-shadow:0 12px 28px -14px rgba(20,33,58,.45);margin-bottom:14px;line-height:0}
.banner img{display:block;width:100%;height:auto}
.greet{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 14px}
.greet b{font-size:20px;color:var(--ac);display:block;line-height:1.5}.greet span{font-size:13px;color:var(--mu)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:14px}
.act{background:#fff;border:1px solid var(--bd);box-shadow:0 4px 12px -8px rgba(20,33,58,.3);color:var(--tx);border-radius:14px;padding:11px 4px;font:700 13px Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.act i{font-style:normal;font-size:22px;line-height:1.2}
.kpi{background:#fff!important;border-color:var(--bd)!important;font-size:13px;color:var(--mu)}
.kpi i{font-style:normal;font-size:18px;display:block;line-height:1.4}
.kpi b{font-size:24px!important}
.sec{font-size:15px;color:var(--ac);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(154,111,18,.45),transparent)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.cat .n{font-size:13px;margin:6px 0 2px}
.cat .bar2{height:4px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}
.cat .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#b88a2f,#f0d38a)}
</style>
</head>
<body>
<header>
<div class="brand"><span id="lg"></span><div><h1 id="nm"></h1><small>مدیریت فایل، مشتری و معامله</small></div></div>
<div class="clk"><b id="tm"></b><span id="dt"></span></div>
</header>
<div id="a2h"><b>افزودن به صفحه اصلی گوشی</b><button class="btn" id="a2hb">نصب</button><button class="x" id="a2hx" aria-label="بستن">×</button></div>
<div id="a2hm"><div class="sh"><h2 style="margin:0 0 4px">افزودن به صفحه اصلی</h2><div class="mu">در سافاری این مراحل را انجام بده:</div><ol><li>پایین صفحه روی دکمه‌ی <b>اشتراک‌گذاری</b> (مربع با فلش رو به بالا) بزن</li><li>پایین بیا و <b>Add to Home Screen</b> (افزودن به صفحه اصلی) را بزن</li><li>روی <b>Add</b> (افزودن) بزن</li></ol><button class="btn" id="a2hc" style="width:100%">متوجه شدم</button></div></div>
<div id="nv"></div>
<main id="app"></main>
<script>
const FC={A:'آپارتمان فروشی',B:'پیش‌فروش آپارتمان',C:'ویلایی فروشی',D:'زمین فروشی',E:'مغازه/تجاری فروشی',F:'اداری فروشی',G:'صنعتی فروشی',H:'کشاورزی فروشی',I:'آپارتمان اجاره',J:'ویلایی اجاره',K:'مغازه اجاره',L:'اداری اجاره',M:'صنعتی اجاره',N:'کشاورزی اجاره'};
const RC={A:'مدیر ساختمان',B:'پولدارها',C:'شوراها و دهیارها',D:'سایر مشاور املاک‌ها',E:'سازنده و پیمانکار',F:'دفتر اسناد رسمی',G:'کارشناس و ارزیاب',H:'خدماتی‌ها',I:'معرف‌ها'};
const EB={E1:'فروش و مذاکره',E2:'قانون و قرارداد',E3:'ارزش‌گذاری و بازار',E4:'فنی و ساختمانی',E5:'بازاریابی',E6:'مشتری‌داری',E7:'مدیریت دفتر',E8:'تخصصی دسته‌ها',E9:'یادداشت‌های شخصی'};
const TABS=[['dash','داشبورد'],['f','فایل‌ها'],['m','مشتری‌ها'],['v','بازدیدها'],['d','معاملات'],['r','ارتباطات'],['h','محله‌ها'],['x','هزینه‌ها'],['cal','تقویم'],['e','آموزش'],['s','تنظیمات']];
let S={tab:'dash',user:null,admin:false,cat:'*',eb:'E1',q:'',cnt:{},files:[],cust:[],cons:[],vis:[],deals:[],notes:[],members:[],pw:'1234',name:'دپارتمان حسینی‌نژاد',th:{sale:{t:'pct',v:2},rent:{t:'amt',v:30000000}}};
const $=s=>document.querySelector(s);
const LOGO='<svg class="lg" viewBox="0 0 48 48" role="img" aria-label="لوگو"><rect width="48" height="48" rx="13" fill="#d4ab5a"/><path d="M8 23 24 9l16 14" fill="none" stroke="#14213a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 22v17h20V22" fill="none" stroke="#14213a" stroke-width="3.2" stroke-linejoin="round"/><path d="M20 39v-8a4 4 0 0 1 8 0v8z" fill="#14213a"/></svg>';
const fa=n=>(+n||0).toLocaleString('fa-IR');
const today=()=>new Date().toISOString().slice(0,10);
const jd=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}):'—';
const isSale=c=>c<='H';
const opts=o=>Object.entries(o).map(([k,v])=>'<option value="'+k+'">'+k+' · '+v+'</option>').join('');
const nxt=(p,c)=>{S.cnt[p+c]=(S.cnt[p+c]||0)+1;return p+'-'+c+S.cnt[p+c]};
const tag=c=>'<span class="tag">'+c+'</span>';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function tick(){const d=new Date();$('#dt').textContent=d.toLocaleDateString('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#tm').textContent=d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(tick,1000);

function form(title,fields,ok){
  const m=document.createElement('div');m.className='mo';
  m.innerHTML='<div class="md"><h3>'+title+'</h3>'+fields.map(f=>'<label>'+f.l+(f.t==='s'?'<select data-k="'+f.k+'">'+f.o+'</select>':f.t==='a'?'<textarea rows="3" data-k="'+f.k+'"></textarea>':'<input data-k="'+f.k+'" type="'+(f.t==='number'?'text':(f.t||'text'))+'"'+(f.t==='number'?' inputmode="decimal" data-num="1"':'')+(f.t==='tel'||f.k==='p'?' data-dg="1"':'')+(f.d?' value="'+f.d+'"':'')+'>')+'</label>').join('')+'<div class="bt"><button class="btn" data-ok>ذخیره</button><button class="btn g" data-no>انصراف</button></div></div>';
  m.querySelector('[data-no]').onclick=()=>m.remove();
  m.querySelector('[data-ok]').onclick=()=>{const v={};m.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.value.trim());ok(v);m.remove();render()};
  document.body.appendChild(m);
}

/* data */
const addF=v=>S.files.push({code:nxt('F',v.cat),st:'active',ph:[{d:iso(new Date()),p:+v.price||0}],...v});
const addM=v=>S.cust.push({code:nxt('M',v.cat),st:'جدید',...v});
const addR=v=>S.cons.push({...v,code:nxt('R',v.cat),rd:v.rd||iso(new Date()),cs:v.cs||'فقط شماره دارم'});
function addD(v){
  const f=S.files.find(x=>x.code===v.file);if(!f)return;
  const price=+v.price||0,co=+v.co||0,cc=+v.cc||0;
  S.deals.push({code:'D'+(Math.max(0,...S.deals.map(x=>+String(x.code).slice(1)||0))+1),file:f.code,cat:f.cat,cust:v.cust,price,co,cc,tot:co+cc,po:v.po||'مانده',pc:v.pc||'مانده',date:v.date||iso(new Date())});
  f.st='closed';const c=S.cust.find(x=>x.code===v.cust);if(c)c.st='معامله شد';
}
const hi=d=>{const t=S.th[isSale(d.cat)?'sale':'rent'];return t.v>0&&(t.t==='pct'?(d.price?d.tot/d.price*100:0)>=t.v:d.tot>=t.v)};
function seed(){
  addF({cat:'A',area:'ولنجک',size:120,price:9500,owner:'آقای رضایی',phone:'۰۹۱۲۰۰۰۰۰۰۱'});
  addF({cat:'A',area:'سعادت‌آباد',size:95,price:7200,owner:'خانم کریمی',phone:'۰۹۱۲۰۰۰۰۰۰۲'});
  addF({cat:'C',area:'لواسان',size:400,price:32000,owner:'آقای احمدی',phone:'۰۹۱۲۰۰۰۰۰۰۳'});
  addF({cat:'I',area:'پونک',size:80,price:900,owner:'آقای نوری',phone:'۰۹۱۲۰۰۰۰۰۰۴'});
  addM({cat:'A',name:'سارا محمدی',phone:'۰۹۳۰۰۰۰۰۰۰۱',budget:'۷ تا ۱۰ میلیارد',area:'ولنجک',next:'2026-10-30'});
  addM({cat:'I',name:'علی حیدری',phone:'۰۹۳۰۰۰۰۰۰۰۲',budget:'رهن ۴۰۰ میلیون',area:'پونک',next:'2026-11-10'});
  addR({cat:'A',name:'آقای صادقی',phone:'۰۹۱۰۰۰۰۰۰۰۱',area:'ولنجک',note:'مدیر برج آسمان'});
  addR({cat:'I',name:'خانم موسوی',phone:'۰۹۱۰۰۰۰۰۰۰۲',area:'',note:'معرف'});
  S.vis.push({code:'V1',cust:'M-A1',file:'F-A1',date:'2026-10-28',res:'پسندید',note:'می‌خواد دوباره ببینه'});
  addD({file:'F-I1',cust:'M-I1',price:900,co:15,cc:15,pay:'دریافت‌شده',date:'2026-11-01'});
  S.notes.push({id:1,eb:'E1',ty:'متن',title:'سه قدم برای بستن معامله',text:'خلاصه‌ی نیاز مشتری را تکرار کن، یک مزیت اصلی بگو، قرار بعدی را همان لحظه بگیر.',tags:'مذاکره'});
}

/* views */
function dash(){
  const act=S.files.filter(f=>f.st==='active').length,tc=S.deals.reduce((a,d)=>a+d.tot,0),late=S.cust.filter(c=>c.next&&c.next<today()&&c.st!=='معامله شد'&&!c.off);
  const rows=Object.keys(FC).map(k=>{const t=S.files.filter(f=>f.cat===k),m=S.cust.filter(c=>c.cat===k);return '<tr><td>'+tag(k)+'</td><td>'+FC[k]+'</td><td>'+fa(t.length)+'</td><td>'+fa(t.filter(f=>f.st==='active').length)+'</td><td>'+fa(m.length)+'</td></tr>'}).join('');
  return '<div class="hero"><b>سلام، '+esc(S.user)+'</b><span>'+fa(act)+' فایل فعال دارید'+(late.length?' و '+fa(late.length)+' مشتری منتظر پیگیری است.':'؛ پیگیری عقب‌افتاده‌ای نیست.')+'</span></div><div class="grid"><div class="kpi"><b>'+fa(S.files.length)+'</b>کل فایل‌ها</div><div class="kpi"><b>'+fa(act)+'</b>فایل فعال</div><div class="kpi"><b>'+fa(S.cust.length)+'</b>مشتری</div><div class="kpi"><b>'+fa(S.deals.length)+'</b>معامله</div><div class="kpi"><b>'+fa(tc)+'</b>کمیسیون (میلیون)</div></div>'
  +(late.length?'<div class="card warn"><b>نیاز به پیگیری</b>'+late.map(c=>'<div class="mu">'+tag(c.code)+' '+esc(c.name)+' · تماس: '+c.next+'</div>').join('')+'</div>':'')
  +'<div class="card"><table><tr><th>کد</th><th>دسته</th><th>فایل</th><th>فعال</th><th>مشتری</th></tr>'+rows+'</table></div>';

const cmpD=(a,b)=>(a.d||'')<(b.d||'')?-1:(a.d||'')>(b.d||'')?1:0;
const phs=f=>{const h=(f.ph||[]).slice();if(!h.length)h.push({d:null,p:f.price});return h.sort(cmpD)};
const pct=(a,b)=>a?((b-a)/a*100):0;
const arr=x=>(x>0?'▲ ':x<0?'▼ ':'')+fa(Math.abs(x).toFixed(1))+'٪';
function phV(f){const h=phs(f);if(h.length<2)return '';
  const rows=h.map((e,n)=>{const pr=n?h[n-1].p:null;return '<div class="row" style="padding:4px 0;border-top:1px solid var(--bd);font-size:13px"><span>'+(e.d?jd(e.d):'ثبت اولیه')+(e.n?' · '+esc(e.n):'')+'</span><span>'+fa(e.p)+(f.size>0?' <span class="mu">(متری '+fa(Math.round(e.p/f.size))+')</span>':'')+(pr?' <b style="color:var(--ac)">'+arr(pct(pr,e.p))+'</b>':'')+'</span></div>'}).reverse().join('');
  return '<details style="margin-top:8px"><summary class="mu" style="cursor:pointer">📈 تاریخچه‌ی قیمت ('+fa(h.length)+' ثبت · از اولین ثبت '+arr(pct(h[0].p,h[h.length-1].p))+')</summary><div style="margin-top:6px">'+rows+'</div></details>'}
function trendV(){const g={};flt(S.files).forEach(f=>{const h=phs(f).filter(e=>e.d);if(h.length<2||!(f.size>0))return;const k=(f.area||'').trim()+'|'+f.cat;const a=h[0],b=h[h.length-1];const o=g[k]=g[k]||{area:(f.area||'').trim(),cat:f.cat,a:[],b:[],d1:a.d,d2:b.d,n:0};o.a.push(a.p/f.size);o.b.push(b.p/f.size);o.n++;if(a.d<o.d1)o.d1=a.d;if(b.d>o.d2)o.d2=b.d});

function fmtNum(v){var n=normD(v).replace(/٫/g,'.').replace(/[^0-9.]/g,'');var p=n.split('.');var ip=p[0].replace(/^0+(?=[0-9])/,'').replace(/\B(?=([0-9]{3})+(?![0-9]))/g,',');return p.length>1?ip+'.'+p.slice(1).join(''):ip}
function NV(s){return +String(s==null?'':normD(s)).replace(/[^0-9.]/g,'')||0}
document.addEventListener('input',function(e){var t=e.target;if(!t||!t.dataset||(t.dataset.dg==null&&t.dataset.num==null))return;var v=t.value;if(t.dataset.num!=null){var pos=t.selectionStart==null?v.length:t.selectionStart;var cnt=normD(v.slice(0,pos)).replace(/[^0-9.]/g,'').length;var n=fmtNum(v);if(n!==v){t.value=n;var q=0,c=0;while(q<n.length&&c<cnt){if(/[0-9.]/.test(n[q]))c++;q++}try{t.setSelectionRange(q,q)}catch(x){}}return}var n2=nd(t.value);if(n2!==t.value){t.value=n2;try{t.setSelectionRange(n2.length,n2.length)}catch(x){}}},true);
window.alert=function(m){setSt(String(m));setTimeout(function(){setSt('')},4000)};
function login(){
  return '<div class="login card"><div class="lgn"><div class="banner"><img src="'+HERO+'" alt=""></div><div class="mu">برای ورود، رمز را وارد کنید</div></div><label>رمز<input id="lp" type="password" data-dg="1" onkeydown="if(event.key===\'Enter\')doLogin()"></label><button class="btn" style="width:100%" onclick="doLogin()">ورود</button><div class="note" id="le">'+(S.pw==='1234'?'رمز اولیه ۱۲۳۴ است؛ بعد از ورود از تنظیمات عوض کنید.':'')+'</div></div>';
}
function doLogin(){
  const p=nd($('#lp').value);const m=S.members.find(x=>nd(x.p)===p);
  if(p&&p===nd(S.pw)){S.user='مدیر';S.admin=true;render()}
  else if(p&&m){S.user=m.u;S.admin=false;render()}
  else{$('#le').textContent='رمز درست نیست.';$('#le').style.color='var(--bad)'}
}

var TS={};function snap(){return {files:S.files,cust:S.cust,cons:S.cons,vis:S.vis,deals:S.deals,notes:S.notes,members:S.members,exp:S.exp,ev:S.ev,th:S.th,name:S.name,cnt:S.cnt,pw:S.pw,hoods:S.hoods}}
var DB=null,UID=null,AS=null,LAST={},BUSY=false,DIRTY=false;
const KEYS=['files','cust','cons','vis','deals','notes','members','exp','ev','th','name','cnt','pw','hoods'];
function setSt(m){let e=document.getElementById('st');if(!e){e=document.createElement('div');e.id='st';e.style.cssText='position:fixed;bottom:8px;left:8px;right:8px;z-index:99;background:#7a1f1f;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;text-align:center';document.body.appendChild(e)}e.textContent=m;e.style.display=m?'block':'none'}
async function flush(){if(!DB)return;if(BUSY){DIRTY=true;return}BUSY=true;try{do{DIRTY=false;const s=snap();for(const k of KEYS){const j=JSON.stringify(s[k]);if(LAST[k]!==j){await DB.collection('data/users/'+UID).doc('s_'+k).set({j:j,t:TS[k]||Date.now()});LAST[k]=j}}}while(DIRTY);setSt('')}catch(e){setSt('ذخیره روی سرور انجام نشد؛ اتصال اینترنت را بررسی کنید.')}BUSY=false}
var LJ={};function save(){const sn=snap();for(const k of KEYS){const j=JSON.stringify(sn[k]);if(LJ[k]!==j){if(k in LJ)TS[k]=Date.now();LJ[k]=j}}try{localStorage.setItem('hcrm',JSON.stringify({d:sn,t:TS,v:2}))}catch(e){}flush()}
function render(keep){restoreH();save();
  $('#nm').textContent=S.name;$('#lg').innerHTML=LOGO;document.title=S.name;
  if(!S.user){$('#nv').innerHTML='';$('#app').innerHTML=login();return}
  const tabs=TABS.filter(t=>S.admin||(t[0]!=='s'&&t[0]!=='d'&&t[0]!=='x'));
  if(!tabs.some(t=>t[0]===S.tab))S.tab='dash';
  const cur=tabs.find(t=>t[0]===S.tab);
  $('#nv').innerHTML='<div class="bar"><button class="mb" onclick="toggleMenu()" aria-label="منو">☰</button><b>'+cur[1]+'</b></div>'+(MENU?'<div class="ov" onclick="toggleMenu()"></div><aside class="dr">'+tabs.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" onclick="MENU=false;S.tab=\''+t[0]+'\';S.cat=\'*\';render()">'+t[1]+'</button>').join('')+'<button class="ex" onclick="MENU=false;S.user=null;render()">خروج</button></aside>':'');
  const v={cal:calV,x:expV,dash,f:filesV,m:custV,r:consV,h:hoodV,v:visV,d:dealV,e:eduV,s:setV}[S.tab];
  $('#app').innerHTML=v();
  if(keep){const i=$('#qi');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
let MENU=false;function toggleMenu(){MENU=!MENU;render()}
function seed(){}
function chPw(){form('تغییر رمز مدیر',[{k:'p',l:'رمز جدید'}],v=>{if(v.p&&v.p.length>=4){S.pw=v.p;TS.pw=Date.now();alert('رمز تغییر کرد و ذخیره شد.')}else alert('رمز باید حداقل ۴ حرف باشد.')})}
async function backup(){try{const d=await claude.use('downloads');if(!d){alert('پشتیبان‌گیری در این نمایش ممکن نیست.');return}await d.save({filename:'backup-'+today()+'.json',data:JSON.stringify(snap())})}catch(e){}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.files))throw 0;form('اطلاعات فعلی با این پشتیبان جایگزین می‌شود. ادامه؟',[],()=>{Object.assign(S,d)})}catch(e){alert('این فایل پشتیبان معتبر نیست.')}};r.readAsText(f)}
(async function(){
let local=null;try{local=JSON.parse(localStorage.getItem('hcrm')||'null')}catch(e){}
if(local){if(local.v===2){Object.assign(S,local.d);TS=local.t||{}}else Object.assign(S,local)}
for(const k of KEYS)LJ[k]=JSON.stringify(S[k]);
try{await Promise.race([(async()=>{
const u=await claude.use('user'),d=await claude.use('db');AS=await claude.use('assets');
if(!u||!d){setSt('ذخیره‌ی دائمی فعال نیست. در گوشی وارد حساب Claude شوید و دوباره باز کنید.');return}
const id=await u.id();const L={};
for(const k of KEYS){const x=await d.collection('data/users/'+id).doc('s_'+k).get();if(x.exists){const dd=x.data(),j=dd.j,st=dd.t||0;L[k]=j;if(st>=(TS[k]||0)){S[k]=JSON.parse(j);LJ[k]=j;TS[k]=st}}}
LAST=L;UID=id;DB=d;
try{localStorage.setItem('hcrm',JSON.stringify({d:snap(),t:TS,v:2}))}catch(e){}
if(!S.user)render();flush();
})(),new Promise((_,r)=>setTimeout(r,20000))])}catch(e){setSt('اتصال به ذخیره‌ی سرور برقرار نشد.')}
tick();render();
})();
</script>

try{
var standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
var bar=document.getElementById('a2h'),m=document.getElementById('a2hm');
var hidden=false;try{hidden=sessionStorage.getItem('a2hx')==='1'}catch(e){}
if(!standalone&&!hidden)bar.style.display='flex';
document.getElementById('a2hb').onclick=function(){m.style.display='flex'};

document.getElementById('a2hx').onclick=function(){bar.style.display='none';try{sessionStorage.setItem('a2hx','1')}catch(e){}};
